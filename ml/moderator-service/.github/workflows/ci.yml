name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Ruff
        run: pip install ruff
        
      - name: Run Ruff Linter
        run: ruff check service/app/ sdk/moderator_sdk/
        
      - name: Run Ruff Formatter validation
        run: ruff format --check service/app/ sdk/moderator_sdk/

  test-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: moderator
          POSTGRES_PASSWORD: moderator_pass
          POSTGRES_DB: moderator_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: service/requirements.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt
          pip install pytest-cov
          
      - name: Run service tests
        env:
          DATABASE_URL: postgresql+asyncpg://moderator:moderator_pass@localhost:5432/moderator_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_which_is_random
          LLM_PROVIDER: groq
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
        run: |
          cd service
          pytest tests/ -v --cov=app --ignore=tests/e2e

  test-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install SDK and test dependencies
        run: |
          python -m pip install --upgrade pip
          cd sdk
          pip install -e ".[dev]"
          
      - name: Run SDK tests
        run: |
          cd sdk
          pytest tests/ -v
