[tool.ruff]
target-version = "py311"
line-length = 100
src = ["service/app", "sdk/moderator_sdk"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8 naming
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",  # raise ... from err (too noisy in async context)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require running services",
    "e2e: marks end-to-end tests",
]
