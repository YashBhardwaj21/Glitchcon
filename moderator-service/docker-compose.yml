version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: moderator_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moderator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moderator_pass}
      POSTGRES_DB: ${POSTGRES_DB:-moderator_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-moderator} -d $${POSTGRES_DB:-moderator_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moderator_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  service:
    build: 
      context: ./service
      dockerfile: Dockerfile
    container_name: moderator_api
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-moderator}:${POSTGRES_PASSWORD:-moderator_pass}@postgres:5432/${POSTGRES_DB:-moderator_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: moderator_celery
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-moderator}:${POSTGRES_PASSWORD:-moderator_pass}@postgres:5432/${POSTGRES_DB:-moderator_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: moderator_flower
    restart: always
    command: celery -A app.tasks.celery_app flower --port=5555
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
