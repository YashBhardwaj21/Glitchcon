[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moderator-sdk"
version = "0.1.0"
description = "Python SDK for AI Moderation Microservice"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "GBA", email = "admin@example.com" }
]
keywords = ["moderation", "ai", "llm", "content-safety", "multilingual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/YashBhardwaj21/Glitchcon"
Issues   = "https://github.com/YashBhardwaj21/Glitchcon/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
