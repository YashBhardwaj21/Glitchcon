[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moderator-sdk"
version = "0.1.0"
description = "Python SDK for AI Moderation Microservice"
readme = "README.md"
authors = [
    { name = "GBA", email = "admin@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
